<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Producto - Gafas de Sol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <article class="product-card">
        <div class="image-container">
            <img src=https://photos.app.goo.gl/ndFAWaEfFYXJHqoy7">
            <div class="savings-tag">
                <span class="tag-icon">🏷️</span> AHORRAS L 270
            </div>
        </div>

        <div class="product-info">
            <h2 class="product-title">NUEVAS GAFAS DE SOL PREMIUM</h2>
            
            <div class="rating">
                <span class="stars">★★★★★</span>
                <span class="reviews-count">(5)</span>
            </div>

            <div class="price-container">
                <span class="current-price">L 1270.00</span>
                <span class="old-price">L 1540.00</span>
            </div>
        </div>
    </article>

</body>
</html>
